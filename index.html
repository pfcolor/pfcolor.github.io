<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>번역가 김동욱 | 포트폴리오</title>
<meta name="description" content="영어를 한국어로 번역합니다. 인문·사회 분야를 중심으로 다양한 글을 다룹니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <img class="photo" src="assets/img/profile.jpg" alt="김동욱 프로필 사진" loading="lazy">
    <div>
      <h1>김동욱</h1>
      <p class="intro">
        영어를 한국어로 번역합니다. 인문·사회 분야를 중심으로 다양한 글을 다룹니다.
        번역가 공동체 <a href="https://pubhub.kr/">펍헙번역그룹</a>에서 활동하고 있습니다.
      </p>
    </div>
    <div class="meta">
      <div class="mail"><a href="mailto:mail@kimdongwook.com">mail@kimdongwook.com</a></div>
      <div class="links">
        <a href="https://brunch.co.kr/@kimdongwook-tr">브런치</a>
        <span class="sep">·</span>
        <a href="https://instagram.com/kimdongwook.translator">인스타그램</a>
        <span class="sep">·</span>
        <a href="https://www.threads.com/@kimdongwook.translator">스레드</a>
        <span class="sep">·</span>
        <a href="https://facebook.com/dongwook.translator">페이스북</a>
      </div>
    </div>
  </header>

  <section>
    <div class="eyebrow">
      <div class="tab"></div>
      <h2>책</h2>
      <span class="count" data-count-for="#book-list"></span>
    </div>
    <div class="books" id="book-list"></div>
    <button class="more" id="book-more" data-target="#book-list" data-steps="10,50,100,150" hidden>
      <span class="label"></span><span class="arrow">▾</span>
    </button>
  </section>

  <section>
    <div class="eyebrow">
      <div class="tab"></div>
      <h2>논문</h2>
      <span class="count" data-count-for="#paper-list"></span>
    </div>
    <ul class="list" id="paper-list"></ul>
    <button class="more" id="paper-more" data-target="#paper-list" data-steps="5,50,100,150" hidden>
      <span class="label"></span><span class="arrow">▾</span>
    </button>
  </section>

  <section>
    <div class="eyebrow">
      <div class="tab"></div>
      <h2>기사</h2>
      <span class="count" data-count-for="#article-list"></span>
    </div>
    <ul class="list" id="article-list"></ul>
    <button class="more" id="article-more" data-target="#article-list" data-steps="5,50,100,150" hidden>
      <span class="label"></span><span class="arrow">▾</span>
    </button>
  </section>

  <footer>
    © 김동욱
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
